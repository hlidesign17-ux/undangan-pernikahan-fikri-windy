<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visual Layout Editor - Undangan Pernikahan</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Kaushan+Script&family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles.css" />

    <style>
      body {
        display: flex;
        height: 100vh;
        overflow: hidden;
        background-color: #18181b;
        color: #f4f4f5;
        font-family: "Plus Jakarta Sans", sans-serif;
      }

      .preview-container {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #09090b;
        padding: 20px;
      }

      .preview-wrapper {
        width: 420px;
        height: 92vh;
        border: 2px solid #27272a;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
        position: relative;
      }

      .preview-wrapper .wedding-container {
        width: 100%;
        height: 100%;
        box-shadow: none;
      }

      .editable-selected {
        outline: 2px dashed #d32f2f !important;
        outline-offset: 4px;
        background-color: rgba(211, 47, 47, 0.15) !important;
      }

      .control-panel {
        width: 390px;
        background-color: #18181b;
        border-left: 1px solid #27272a;
        display: flex;
        flex-direction: column;
        padding: 20px;
        overflow-y: auto;
      }

      .control-panel h2 {
        font-size: 17px;
        margin-bottom: 16px;
        color: #ffffff;
        border-bottom: 1px solid #27272a;
        padding-bottom: 10px;
      }

      .form-group {
        margin-bottom: 14px;
      }

      .form-group label {
        display: block;
        font-size: 11px;
        color: #a1a1aa;
        margin-bottom: 5px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        font-weight: 600;
      }

      .form-group select,
      .form-group input[type="text"],
      .form-group input[type="file"] {
        width: 100%;
        padding: 8px 10px;
        background-color: #27272a;
        border: 1px solid #3f3f46;
        color: #fff;
        border-radius: 6px;
        font-size: 12px;
        outline: none;
      }

      .control-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .control-row input[type="range"] {
        flex: 1;
        accent-color: #d32f2f;
        cursor: pointer;
      }

      .control-row input[type="number"] {
        width: 65px;
        padding: 6px;
        background-color: #27272a;
        border: 1px solid #3f3f46;
        color: #ef4444;
        border-radius: 6px;
        font-size: 12px;
        font-weight: bold;
        text-align: center;
      }

      .toggle-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: #27272a;
        padding: 10px;
        border-radius: 6px;
        margin-bottom: 10px;
      }

      .toggle-row label {
        margin: 0;
        color: #fff;
        text-transform: none;
        font-size: 12px;
      }

      .btn-export {
        margin-top: 10px;
        background-color: #d32f2f;
        color: #fff;
        border: none;
        padding: 12px;
        border-radius: 8px;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
        transition: background 0.2s;
      }

      .btn-export:hover {
        background-color: #b71c1c;
      }

      .help-text {
        font-size: 11px;
        color: #71717a;
        margin-top: 4px;
      }
    </style>
  </head>
  <body>
    <!-- PREVIEW UNDANGAN -->
    <div class="preview-container">
      <div class="preview-wrapper">
        <main class="wedding-container" id="wedding-app"></main>
      </div>
    </div>

    <!-- CONTROLLER EDITOR -->
    <div class="control-panel">
      <h2>🛠️ Visual Layout Editor</h2>

      <!-- PENGATURAN MUSIK DARI KOMPUTER LOKAL -->
      <div class="form-group">
        <label for="input-music-file">Pilih Musik dari Komputer (.mp3)</label>
        <input type="file" id="input-music-file" accept="audio/mp3, audio/*" />
        <div class="help-text" id="music-file-status">
          File Musik Saat Ini: wedding-music.mp3
        </div>
      </div>

      <hr style="border-color: #27272a; margin: 12px 0" />

      <div class="form-group">
        <label for="select-section">Pilih Seksyen</label>
        <select id="select-section"></select>
      </div>

      <div class="toggle-row">
        <label for="check-breathe">Aktifkan Background Zoom Loop</label>
        <input
          type="checkbox"
          id="check-breathe"
          style="accent-color: #d32f2f; transform: scale(1.3)"
        />
      </div>

      <div class="form-group">
        <label>Durasi Zoom (Detik / Sektor)</label>
        <div class="control-row">
          <input type="range" id="range-breathe" min="4" max="30" value="12" />
          <input type="number" id="num-breathe" value="12" /> s
        </div>
      </div>

      <hr style="border-color: #27272a; margin: 12px 0" />

      <div class="form-group">
        <label for="select-element">Pilih Elemen / Teks / Ikon</label>
        <select id="select-element"></select>
      </div>

      <div class="form-group">
        <label for="select-font">Pilihan Jenis Font</label>
        <select id="select-font">
          <option value="'Kaushan Script', cursive">
            Kaushan Script (Brush Calligraphy)
          </option>
          <option value="'Caveat', cursive">Caveat (Handwriting)</option>
          <option value="'Playfair Display', serif">
            Playfair Display (Elegant Serif)
          </option>
          <option value="'Plus Jakarta Sans', sans-serif">
            Plus Jakarta Sans (Clean Modern)
          </option>
        </select>
      </div>

      <div class="form-group">
        <label for="input-color">Warna Teks / Ikon</label>
        <input
          type="color"
          id="input-color"
          value="#1A1A1A"
          style="
            width: 100%;
            height: 36px;
            border: 1px solid #3f3f46;
            background: #27272a;
            border-radius: 6px;
          "
        />
      </div>

      <div class="form-group">
        <label>Posisi Vertikal (Y)</label>
        <div class="control-row">
          <input type="range" id="range-y" min="-250" max="250" value="0" />
          <input type="number" id="num-y" value="0" /> px
        </div>
      </div>

      <div class="form-group">
        <label>Posisi Horizontal (X)</label>
        <div class="control-row">
          <input type="range" id="range-x" min="-180" max="180" value="0" />
          <input type="number" id="num-x" value="0" /> px
        </div>
      </div>

      <div class="form-group">
        <label>Rotasi (Rotate)</label>
        <div class="control-row">
          <input
            type="range"
            id="range-rotate"
            min="-180"
            max="180"
            value="0"
          />
          <input type="number" id="num-rotate" value="0" /> °
        </div>
      </div>

      <div class="form-group">
        <label>Ukuran Font</label>
        <div class="control-row">
          <input type="range" id="range-size" min="10" max="72" value="16" />
          <input type="number" id="num-size" value="16" /> px
        </div>
      </div>

      <div class="form-group">
        <label for="input-text">Isi Teks</label>
        <input type="text" id="input-text" />
      </div>

      <button class="btn-export" id="btn-save">💾 Export data.json Baru</button>
    </div>

    <script>
      let globalJsonData = null;
      let selectedSectionId = "section1";
      let selectedElementId = null;

      document.addEventListener("DOMContentLoaded", () => {
        const container = document.getElementById("wedding-app");

        fetch("data.json")
          .then((res) => res.json())
          .then((data) => {
            globalJsonData = data;
            initEditor();
            renderPreview();
          })
          .catch((err) =>
            console.error("Gagal membaca data.json. Gunakan Live Server!", err),
          );

        function initEditor() {
          const secSelect = document.getElementById("select-section");
          secSelect.innerHTML = "";

          globalJsonData.sections.forEach((sec) => {
            const opt = document.createElement("option");
            opt.value = sec.id;
            opt.textContent = `Seksyen ${sec.id.replace("section", "")}`;
            secSelect.appendChild(opt);
          });

          secSelect.addEventListener("change", (e) => {
            selectedSectionId = e.target.value;
            updateSectionControls();
            updateElementDropdown();
            scrollToSection(selectedSectionId);
          });

          // Input Pengunggah Musik dari Komputer
          const musicFileInput = document.getElementById("input-music-file");
          const musicStatus = document.getElementById("music-file-status");

          if (globalJsonData.musicUrl) {
            musicStatus.textContent = `File Musik Saat Ini: ${globalJsonData.musicUrl}`;
          }

          musicFileInput.addEventListener("change", (e) => {
            if (e.target.files.length > 0) {
              const fileName = e.target.files[0].name;
              globalJsonData.musicUrl = fileName;
              musicStatus.textContent = `File Musik Dipilih: ${fileName}`;
              alert(
                `Musik "${fileName}" dipilih. Pastikan file MP3 tersebut disimpan di dalam folder proyek yang sama!`,
              );
            }
          });

          updateSectionControls();
          updateElementDropdown();
          bindInputEvents();
        }

        function updateSectionControls() {
          const currentSec = globalJsonData.sections.find(
            (s) => s.id === selectedSectionId,
          );
          if (!currentSec) return;

          const checkBreathe = document.getElementById("check-breathe");
          checkBreathe.checked = currentSec.bgBreathe ?? true;

          syncControls("breathe", currentSec.breatheDuration || 12);
        }

        function updateElementDropdown() {
          const elSelect = document.getElementById("select-element");
          elSelect.innerHTML = "";

          const currentSec = globalJsonData.sections.find(
            (s) => s.id === selectedSectionId,
          );

          if (currentSec.content) {
            currentSec.content.forEach((item) => {
              const opt = document.createElement("option");
              opt.value = item.id;
              opt.textContent = `[Teks] ${item.id}`;
              elSelect.appendChild(opt);
            });
          }

          if (currentSec.icons) {
            currentSec.icons.forEach((icon) => {
              const opt = document.createElement("option");
              opt.value = icon.id;
              opt.textContent = `[Ikon] ${icon.id}`;
              elSelect.appendChild(opt);
            });
          }

          elSelect.addEventListener("change", (e) => {
            selectedElementId = e.target.value;
            loadElementToControls();
            highlightSelectedElement();
          });

          if (elSelect.options.length > 0) {
            selectedElementId = elSelect.options[0].value;
            loadElementToControls();
            highlightSelectedElement();
          }
        }

        function loadElementToControls() {
          const target = findElementObject(selectedElementId);
          if (!target) return;

          syncControls("y", target.transformY || 0);
          syncControls("x", target.transformX || 0);
          syncControls("rotate", target.rotate || 0);
          syncControls("size", parseInt(target.style?.fontSize) || 16);

          document.getElementById("select-font").value =
            target.style?.fontFamily || "'Plus Jakarta Sans', sans-serif";
          document.getElementById("input-color").value =
            target.style?.color || target.color || "#1A1A1A";
          document.getElementById("input-text").value =
            target.text || target.symbol || "";
        }

        function syncControls(type, val) {
          document.getElementById(`range-${type}`).value = val;
          document.getElementById(`num-${type}`).value = val;
        }

        function bindInputEvents() {
          document
            .getElementById("check-breathe")
            .addEventListener("change", (e) => {
              const currentSec = globalJsonData.sections.find(
                (s) => s.id === selectedSectionId,
              );
              if (currentSec) currentSec.bgBreathe = e.target.checked;
              renderPreview();
            });

          ["breathe", "y", "x", "rotate", "size"].forEach((type) => {
            const range = document.getElementById(`range-${type}`);
            const num = document.getElementById(`num-${type}`);

            range.addEventListener("input", (e) => {
              num.value = e.target.value;
              applyStyleUpdate(type, e.target.value);
            });

            num.addEventListener("input", (e) => {
              range.value = e.target.value;
              applyStyleUpdate(type, e.target.value);
            });
          });

          document
            .getElementById("select-font")
            .addEventListener("change", (e) =>
              updateStyle("fontFamily", e.target.value),
            );
          document
            .getElementById("input-color")
            .addEventListener("input", (e) =>
              updateStyle("color", e.target.value),
            );
          document
            .getElementById("input-text")
            .addEventListener("input", (e) =>
              updateStyle("text", e.target.value),
            );
          document
            .getElementById("btn-save")
            .addEventListener("click", downloadJson);
        }

        function applyStyleUpdate(type, val) {
          const parsedVal = parseInt(val) || 0;
          if (type === "breathe") {
            const currentSec = globalJsonData.sections.find(
              (s) => s.id === selectedSectionId,
            );
            if (currentSec) currentSec.breatheDuration = parsedVal;
            renderPreview();
          } else {
            if (type === "y") updateStyle("transformY", parsedVal);
            if (type === "x") updateStyle("transformX", parsedVal);
            if (type === "rotate") updateStyle("rotate", parsedVal);
            if (type === "size") updateStyle("fontSize", `${parsedVal}px`);
          }
        }

        function updateStyle(key, value) {
          const target = findElementObject(selectedElementId);
          if (!target) return;

          if (!target.style) target.style = {};

          if (
            key === "transformY" ||
            key === "transformX" ||
            key === "rotate"
          ) {
            target[key] = value;
          } else if (key === "fontSize") {
            target.style.fontSize = value;
          } else if (key === "fontFamily") {
            target.style.fontFamily = value;
          } else if (key === "color") {
            target.style.color = value;
            if (target.symbol !== undefined) target.color = value;
          } else if (key === "text") {
            if (target.text !== undefined) target.text = value;
            if (target.symbol !== undefined) target.symbol = value;
          }

          renderPreview();
        }

        function findElementObject(id) {
          for (let sec of globalJsonData.sections) {
            let item = sec.content?.find((i) => i.id === id);
            if (item) return item;
            if (sec.icons) {
              let icon = sec.icons.find((i) => i.id === id);
              if (icon) return icon;
            }
          }
          return null;
        }

        function getItemClass(id) {
          if (id.includes("sub") || id.includes("header")) return "sub-header";
          if (id.includes("main")) return "main-title";
          if (id.includes("title")) return "section-title";
          if (id.includes("name")) return "name-title";
          if (id.includes("tag") || id.includes("badge")) return "accent-text";
          if (id.includes("body")) return "body-text";
          if (id.includes("quote")) return "quote-text";
          if (id.includes("parent")) return "parent-text";
          if (id.includes("footer")) return "footer-text";
          if (id.includes("amp")) return "ampersand";
          return "";
        }

        function renderPreview() {
          container.innerHTML = "";

          globalJsonData.sections.forEach((sec) => {
            const secEl = document.createElement("section");
            secEl.id = sec.id;

            let breatheClass =
              (sec.bgBreathe ?? true) ? "bg-breathe-active" : "";
            secEl.className = `wedding-section bg-in-view ${breatheClass}`;
            secEl.style.setProperty(
              "--breathe-duration",
              `${sec.breatheDuration || 12}s`,
            );

            let topContentHtml = "";
            let centerContentHtml = "";
            let bottomContentHtml = "";
            let iconsHtml = "";

            sec.content.forEach((item) => {
              const cssClass = getItemClass(item.id);
              const isSelected =
                item.id === selectedElementId ? "editable-selected" : "";

              const fontSizeStyle = item.style?.fontSize
                ? `font-size: ${item.style.fontSize};`
                : "";
              const fontFamilyStyle = item.style?.fontFamily
                ? `font-family: ${item.style.fontFamily};`
                : "";
              const colorStyle = item.style?.color
                ? `color: ${item.style.color};`
                : "";
              const transformStyle = `transform: translate3d(${item.transformX || 0}px, ${item.transformY || 0}px, 0) rotate(${item.rotate || 0}deg); ${fontSizeStyle} ${fontFamilyStyle} ${colorStyle}`;

              let elementHtml = "";
              if (item.type === "button") {
                const btnClass = item.id.includes("map")
                  ? "map-btn"
                  : "social-btn";
                elementHtml = `<a href="#" class="${btnClass} ${isSelected}" id="node-${item.id}" style="${transformStyle}">${item.text}</a>`;
              } else if (item.type === "info_item") {
                elementHtml = `
                <div class="info-item ${isSelected}" id="node-${item.id}" style="${transformStyle}">
                  <span class="info-icon">${item.icon}</span>
                  <span>${item.text}</span>
                </div>`;
              } else {
                elementHtml = `<div class="${cssClass} ${isSelected}" id="node-${item.id}" style="${transformStyle}">${item.text}</div>`;
              }

              if (
                item.id.includes("sub") ||
                item.id.includes("header") ||
                item.id.includes("main") ||
                item.id.includes("title") ||
                item.id.includes("amp")
              ) {
                topContentHtml += elementHtml;
              } else if (item.type === "info_item" || item.id.includes("map")) {
                centerContentHtml += elementHtml;
              } else {
                bottomContentHtml += elementHtml;
              }
            });

            if (sec.icons) {
              sec.icons.forEach((ic, idx) => {
                const isSelected =
                  ic.id === selectedElementId ? "editable-selected" : "";
                let posClass = `heart-pos-${sec.id.replace("section", "")}`;
                if (sec.id === "section1")
                  posClass = idx === 0 ? "heart-pos-1" : "heart-pos-2";

                const transformStyle = `transform: translate3d(${ic.transformX || 0}px, ${ic.transformY || 0}px, 0) rotate(${ic.rotate || 0}deg); color: ${ic.color || ic.style?.color || "#D32F2F"};`;

                iconsHtml += `<span class="icon-heart ${posClass} ${isSelected}" id="node-${ic.id}" style="${transformStyle}">${ic.symbol}</span>`;
              });
            }

            let isPaddedBox = sec.id === "section2" ? "padded-box" : "";

            secEl.innerHTML = `
            ${topContentHtml ? `<div class="content-wrapper top-content">${topContentHtml}</div>` : ""}
            ${centerContentHtml ? `<div class="content-wrapper center-content info-list">${centerContentHtml}</div>` : ""}
            ${iconsHtml}
            ${bottomContentHtml ? `<div class="content-wrapper bottom-content ${isPaddedBox}">${bottomContentHtml}</div>` : ""}
          `;

            container.appendChild(secEl);
          });

          scrollToSection(selectedSectionId);
        }

        function scrollToSection(id) {
          const targetSec = document.getElementById(id);
          if (targetSec) targetSec.scrollIntoView({ behavior: "smooth" });
        }

        function highlightSelectedElement() {
          document
            .querySelectorAll(".editable-selected")
            .forEach((el) => el.classList.remove("editable-selected"));
          const activeNode = document.getElementById(
            `node-${selectedElementId}`,
          );
          if (activeNode) activeNode.classList.add("editable-selected");
        }

        function downloadJson() {
          const dataStr =
            "data:text/json;charset=utf-8," +
            encodeURIComponent(JSON.stringify(globalJsonData, null, 2));
          const downloadAnchor = document.createElement("a");
          downloadAnchor.setAttribute("href", dataStr);
          downloadAnchor.setAttribute("download", "data.json");
          document.body.appendChild(downloadAnchor);
          downloadAnchor.click();
          downloadAnchor.remove();
        }
      });
    </script>
  </body>
</html>
